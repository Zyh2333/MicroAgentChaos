apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-network-marble-research
  namespace: agent-network
  labels:
    app: agent-network-marble-research
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-network-marble-research
  template:
    metadata:
      labels:
        app: agent-network-marble-research
    spec:
      imagePullSecrets:
        - name: private-registry-secret
      containers:
        - name: agent-network-marble-research
          image: 47.121.177.73:81/agent/agent-network-marble-research:py310-microagentchaos
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 10202
          env:
            - name: PROXY_IP
              value: fault-proxy.chaos.svc.cluster.local
            - name: PROXY_PORT
              value: "18800"
            - name: DEEPSEEK_API_KEY
              value: $DEEPSEEK_API_KEY$
            - name: SERVICE_PORT
              value: "10202"
            - name: AGENT_WEB_THREADS
              value: "64"
            - name: OPENAI_API_KEY
              value: $OPENAI_API_KEY$

            - name: OPENAI_API_BASE_ROUTE_KEY
              value: $OPENAI_API_KEY$
            - name: OPENAI_API_BASE_ROUTE_MODEL
              value: qwen3.5-flash
            - name: OPENAI_API_BASE_ROUTE
              value: https://dashscope.aliyuncs.com/compatible-mode/v1

            - name: OPENAI_MODEL
              value: qwen3.5-flash

            - name: MINIO_ACCESS_KEY
              value: AKIAIOSFODNN7EXAMPLE

            - name: MINIO_SECRET_KEY
              value: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
            - name: STORAGE_DOMAIN
              value: minio.agent.network.com:12104

            - name: CENTER_ADDR
              value: http://$HOST_IP$:8848
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-network-marble-research
  namespace: agent-network
spec:
  selector:
    app: agent-network-marble-research
  ports:
    - name: http
      port: 10202
      targetPort: http
