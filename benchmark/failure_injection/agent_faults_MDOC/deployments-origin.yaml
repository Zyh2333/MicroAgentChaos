apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: agent-network-csv-gen
  name: agent-network-csv-gen
  namespace: agent-network
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: agent-network-csv-gen
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: agent-network-csv-gen
    spec:
      containers:
      - env:
        - name: PROXY_IP
          value: fault-proxy.chaos.svc.cluster.local
        - name: PROXY_PORT
          value: "18800"
        - name: DEEPSEEK_API_KEY
          value: $DEEPSEEK_API_KEY$
        - name: OPENAI_API_KEY
          value: $OPENAI_API_KEY$
        - name: OPENAI_MODEL
          value: qwen3.5-flash
        - name: OPENAI_API_BASE
          value: https://dashscope.aliyuncs.com/compatible-mode/v1
        - name: OPENAI_API_BASE_ROUTE_KEY
          value: $OPENAI_API_KEY$
        - name: OPENAI_API_BASE_ROUTE_MODEL
          value: qwen3.5-flash
        - name: OPENAI_API_BASE_ROUTE
          value: https://dashscope.aliyuncs.com/compatible-mode/v1
        - name: MINIO_ACCESS_KEY
          value: AKIAIOSFODNN7EXAMPLE
        - name: MINIO_SECRET_KEY
          value: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        - name: STORAGE_DOMAIN
          value: minio.agent.network.com:12104
        - name: CENTER_ADDR
          value: http://$HOST_IP$:8848
        image: 47.121.177.73:81/agent/agent-network-csv-gen:py310-microagentchaos
        imagePullPolicy: Always
        name: agent-network-csv-gen
        ports:
        - containerPort: 10121
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: "/dev/termination-log"
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: private-registry-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: agent-network-csv-gen
  namespace: agent-network
spec:
  selector:
    app: agent-network-csv-gen
  ports:
    - name: http
      port: 10121
      targetPort: 10121
