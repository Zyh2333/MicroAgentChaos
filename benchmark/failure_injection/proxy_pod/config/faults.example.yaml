#
#
#   python -m proxy_pod.server --config config/faults.example.yaml
#   curl -XPOST --data-binary @config/faults.example.yaml \
#        http://<proxy>:8900/__fault__/rules

proxy:
  listen: "0.0.0.0:8900"
  upstreams:
    # llm: "https://api.openai.com"
    deepseek: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
    qwen: "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode"
    tool: "http://tool-service.default.svc.cluster.local:8080"
  default_upstream: "qwen"
  routes:
    - { path_prefix: "/v1", upstream: "qwen" }
    - { path_prefix: "/tools", upstream: "tool" }
  force_non_stream: true

faults:

  - id: f1_pod_crash_503
    category: F1
    description: "Upstream instance crashed or unavailable (503); persistent service fault requiring restart"
    scope: service
    persistence: persistent
    propagation: downstream
    recovery: restart
    match: { upstream: "llm", methods: ["POST"] }
    stage: request
    action: abort
    status: 503
    body: { error: { type: "service_unavailable", message: "upstream pod crashed" } }

  - id: f1_resource_exhaustion_slow
    category: F1
    description: "Resource exhaustion slows processing (continuous 8-second delay)"
    scope: service
    persistence: persistent
    propagation: downstream
    recovery: auto
    match: { upstream: "llm" }
    stage: request
    action: delay
    value: 8000

  - id: f1_network_unreachable
    category: F1
    description: "Network unreachable: connection dropped or timed out intermittently (30%)"
    scope: call
    persistence: intermittent
    propagation: local
    recovery: retry
    match: { upstream: "tool" }
    stage: request
    action: drop


  - id: f2_auth_fail_call
    category: F2
    description: "Invalid credentials on a single call cause 401 (request scope)"
    scope: call
    persistence: single
    propagation: local
    recovery: retry
    match:
      upstream: "llm"
      header_equals: { "X-Fault-Inject": "bad_cred" }
    stage: request
    action: abort
    status: 401
    body: { error: { type: "invalid_api_key", message: "incorrect api key provided" } }

  - id: f2_auth_fail_service
    category: F2
    description: "Expired API key for one service causes 401 on all its calls (persistent service fault)"
    scope: service
    persistence: persistent
    propagation: cross_task
    recovery: config
    match:
      upstream: "llm"
      header_equals: { "X-Service": "report-agent" }
    stage: request
    action: abort
    status: 401
    body: { error: { type: "expired_api_key", message: "api key expired for this service" } }

  - id: f2_auth_fail_cross_service
    category: F2
    description: "Expired shared API key affects all calls to the matched upstream (cross-service propagation)"
    scope: cross_service
    persistence: persistent
    propagation: cross_service
    recovery: config
    match: { upstream: "llm" }
    stage: request
    action: abort
    status: 401
    body: { error: { type: "expired_api_key", message: "shared api key expired" } }
    enabled: false  # Enable separately from the rules above.

  - id: f2_quota_exhausted_429
    category: F2
    description: "Quota exhausted: return 429 for three calls, then recover"
    scope: cross_service
    persistence: burst
    propagation: cross_service
    recovery: auto
    match: { upstream: "llm" }
    stage: request
    action: abort
    status: 429
    body: { error: { type: "insufficient_quota", message: "you exceeded your current quota" } }

  - id: f2_model_mapping_error
    category: F2
    description: "Incorrect model-to-base_url mapping: replace requested model with an unauthorized model, causing downstream 403 or 404"
    scope: service
    persistence: persistent
    propagation: downstream
    recovery: config
    match: { upstream: "llm", path_prefix: "/v1/chat/completions" }
    stage: request
    action: set_json
    target_path: "$.model"
    value: "restricted-model-no-access-9527"


  - id: f3_missing_required_param
    category: F3
    description: "Remove a required downstream tool argument to violate the parameter contract"
    scope: call
    persistence: intermittent
    propagation: downstream
    recovery: retry
    match: { upstream: "tool", path_prefix: "/tools" }
    stage: request
    action: remove_json
    target_path: "$.arguments.query"

  - id: f3_set_task_id_query
    category: F3
    description: "Replace the taskId URL query parameter on a cross-service request"
    scope: call
    persistence: single
    propagation: downstream
    recovery: retry
    match: { upstream: "tool", methods: ["POST"], path_prefix: "/service" }
    stage: request
    action: set_query
    target_path: "$.taskId"
    value: "invalid-task-id"
    enabled: false

  - id: f3_remove_task_id_query
    category: F3
    description: "Remove the taskId URL query parameter from a cross-service request"
    scope: call
    persistence: single
    propagation: downstream
    recovery: retry
    match: { upstream: "tool", methods: ["POST"], path_prefix: "/service" }
    stage: request
    action: remove_query
    target_path: "$.taskId"
    enabled: false

  - id: f3_response_schema_mismatch
    category: F3
    description: "Corrupt response schema by assigning the wrong type to a result field, causing caller parsing failure"
    scope: call
    persistence: single
    propagation: downstream
    recovery: retry
    match: { upstream: "tool" }
    stage: response
    action: set_json
    target_path: "$.result"
    value: null

  - id: f3_response_corrupt
    category: F3
    description: "Corrupt response encoding (mojibake) to simulate cross-service charset mismatch"
    scope: call
    persistence: intermittent
    propagation: downstream
    recovery: retry
    match: { upstream: "llm", path_prefix: "/v1/chat/completions" }
    stage: response
    action: corrupt
    target_path: "$.choices[0].message.content"
    value: "mojibake"

  - id: f3_message_lost
    category: F3
    description: "Cross-service message loss: drop the response to simulate a timeout"
    scope: call
    persistence: intermittent
    propagation: cross_task
    recovery: retry
    match: { upstream: "tool" }
    stage: response
    action: drop


  - id: f4_tool_calls_stripped
    category: F4
    description: "Remove tool_calls from the LLM response so tools are never called"
    scope: task
    persistence: single
    propagation: downstream
    recovery: retry
    match: { upstream: "llm", path_prefix: "/v1/chat/completions" }
    stage: response
    action: set_json
    target_path: "$.choices[0].message.tool_calls"
    value: []

  - id: f4_repeated_execution
    category: F4
    description: "Replay the previous LLM response to repeat a step (effective from the second call)"
    scope: task
    persistence: persistent
    propagation: cross_task
    recovery: restart
    min_count: 1
    match: { upstream: "llm", path_prefix: "/v1/chat/completions" }
    stage: response
    action: duplicate

  - id: f4_premature_truncation
    category: F4
    description: "Truncate LLM output to 30% to simulate incomplete results or early termination"
    scope: call
    persistence: single
    propagation: local
    recovery: retry
    match: { upstream: "llm", path_prefix: "/v1/chat/completions" }
    stage: response
    action: truncate
    target_path: "$.choices[0].message.content"
    value: 0.3
    enabled: false  # Disabled by default for isolated tests.
